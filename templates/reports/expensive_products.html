<!DOCTYPE html>
<!--
    This page is rendered directly by Django on the server and returned as plain HTML.
    It does not require the Next.js frontend client. You can visit it directly in the
    browser at  http://localhost:8000/reports/expensive_products while the Django dev server is running.
-->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expensive Products Report</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background-color: #f4f6f9;
            color: #293241;
        }

        h1 {
            color: #3d5a80;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th {
            background-color: #3d5a80;
            color: #ffffff;
            padding: 0.6rem 1rem;
            text-align: left;
        }

        td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #98c1d9;
        }

        tr:hover td {
            background-color: #e8f0f7;
        }
    </style>
</head>

<body>
    <h1>Expensive Products ( $1000 or more ) Report </h1>
    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>

            {% for product in expensive_products %}
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.price }} </td>
            </tr>
            {% empty %}

            <tr>
                <td colspan="3">No products found.</td>
            </tr>

            {% endfor %}
        </tbody>
    </table>
</body>

</html>
